name: CI

on:
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Typecheck & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for package.json
        id: check-pkg
        run: |
          if [ -f package.json ]; then
            echo "has_pkg=true" >> "$GITHUB_OUTPUT"
          else
            echo "package.json is missing; the working tree is not a valid checkout." >&2
            exit 1
          fi

      - name: Setup Node.js
        if: steps.check-pkg.outputs.has_pkg == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install Dependencies
        if: steps.check-pkg.outputs.has_pkg == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Check Formatting & Lint (Oxc)
        if: steps.check-pkg.outputs.has_pkg == 'true'
        run: |
          npm run lint
          npm run format:check

      - name: Type Check (TypeScript)
        if: steps.check-pkg.outputs.has_pkg == 'true'
        run: npm run typecheck

      - name: Build Packages & Docs
        if: steps.check-pkg.outputs.has_pkg == 'true'
        run: |
          npm run build

      - name: Run Tests with Coverage (Vitest)
        if: steps.check-pkg.outputs.has_pkg == 'true'
        run: npm run test:coverage

  visual-regression:
    name: Visual Regression (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for package.json
        id: check-pkg
        run: |
          if [ -f package.json ]; then
            echo "has_pkg=true" >> "$GITHUB_OUTPUT"
          else
            echo "package.json is missing; the working tree is not a valid checkout." >&2
            exit 1
          fi

      - name: Setup Node.js
        if: steps.check-pkg.outputs.has_pkg == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install Dependencies
        if: steps.check-pkg.outputs.has_pkg == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Get Playwright Version
        if: steps.check-pkg.outputs.has_pkg == 'true'
        id: playwright-version
        run: |
          echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        if: steps.check-pkg.outputs.has_pkg == 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright OS Dependencies
        if: steps.check-pkg.outputs.has_pkg == 'true'
        run: |
          npx playwright install-deps chromium webkit firefox

      - name: Install Playwright Browsers
        if: steps.check-pkg.outputs.has_pkg == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          npx playwright install chromium webkit firefox

      - name: Build Packages & Docs
        if: steps.check-pkg.outputs.has_pkg == 'true'
        run: |
          npm run build

      - name: Run Visual Regression Tests (Playwright)
        if: steps.check-pkg.outputs.has_pkg == 'true'
        run: npm run test:visual

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14


