name: CI

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Check Formatting & Lint (Oxc)
        run: |
          npm run lint || npx oxlint
          npm run format:check || true

      - name: Type Check (TypeScript v7)
        run: npm run typecheck

      - name: Run Tests with Coverage (Vitest)
        run: npm run test:coverage

      - name: Visual Regression Tests (Playwright)
        run: |
          npx playwright install --with-deps
          npm run test:visual
