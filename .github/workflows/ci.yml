name: CI

on:
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for package.json
        id: check-pkg
        run: |
          if [ -f package.json ]; then
            echo "has_pkg=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pkg=false" >> "$GITHUB_OUTPUT"
            echo "No package.json found; skipping JavaScript/TypeScript validation."
          fi

      - name: Setup Node.js
        if: steps.check-pkg.outputs.has_pkg == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install Dependencies
        if: steps.check-pkg.outputs.has_pkg == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Check Formatting & Lint (Oxc)
        if: steps.check-pkg.outputs.has_pkg == 'true'
        run: |
          npm run lint || npx oxlint
          npm run format:check || true

      - name: Type Check (TypeScript v7)
        if: steps.check-pkg.outputs.has_pkg == 'true'
        run: |
          if npm run | grep -q 'typecheck'; then
            npm run typecheck
          fi

      - name: Run Tests with Coverage (Vitest)
        if: steps.check-pkg.outputs.has_pkg == 'true'
        run: |
          if npm run | grep -q 'test:coverage'; then
            npm run test:coverage
          elif npm run | grep -q 'test'; then
            npm test
          fi

      - name: Visual Regression Tests (Playwright)
        if: steps.check-pkg.outputs.has_pkg == 'true'
        run: |
          if npm run | grep -q 'test:visual'; then
            npx playwright install --with-deps chromium webkit firefox
            npm run test:visual
          else
            echo "No test:visual script found in package.json; skipping visual regression tests."
          fi

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

