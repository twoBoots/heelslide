name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: SemVer Release
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for package.json
        id: check-pkg
        run: |
          if [ -f package.json ]; then
            echo "has_pkg=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pkg=false" >> "$GITHUB_OUTPUT"
            echo "No package.json found; skipping package build and release."
          fi

      - name: Setup Node.js
        if: steps.check-pkg.outputs.has_pkg == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        if: steps.check-pkg.outputs.has_pkg == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Packages
        if: steps.check-pkg.outputs.has_pkg == 'true'
        run: npm run build

      - name: Release & Publish Packages
        if: steps.check-pkg.outputs.has_pkg == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Automated SemVer release via npm / changesets
          if npm run | grep -q 'release'; then
            npm run release
          else
            echo "No release script configured in package.json; skipping automated release."
          fi
