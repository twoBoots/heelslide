name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: SemVer Release
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for package.json
        id: check-pkg
        run: |
          if [ -f package.json ]; then
            echo "has_pkg=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pkg=false" >> "$GITHUB_OUTPUT"
            echo "No package.json found; skipping package build and release."
          fi

      - name: Setup Node.js
        if: steps.check-pkg.outputs.has_pkg == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install Dependencies
        if: steps.check-pkg.outputs.has_pkg == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Packages
        if: steps.check-pkg.outputs.has_pkg == 'true'
        run: npm run build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        if: steps.check-pkg.outputs.has_pkg == 'true'
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version-packages
          title: "chore(release): Version Packages"
          commit: "chore(release): Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack & Upload Release Tarballs
        if: steps.check-pkg.outputs.has_pkg == 'true' && steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist-tarballs
          npm pack --workspace=packages/core --pack-destination dist-tarballs/
          npm pack --workspace=packages/react --pack-destination dist-tarballs/
          npm pack --workspace=packages/svelte --pack-destination dist-tarballs/
          npm pack --workspace=packages/vue --pack-destination dist-tarballs/

          echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | .name + "@" + .version' | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Uploading tarball assets to GitHub Release for $tag..."
              gh release upload "$tag" dist-tarballs/*.tgz --clobber || true
            fi
          done
